#
# Bootstrap: uses RUNSAFE_SBOM_BOOTSTRAP/bin/runsafe_sbom (or RUNSAFE_SBOM_PACKAGES if
# not present) for login and enabled-features only. Protect and Identify packages are
# downloaded from packages.runsafesecurity.com in an OS-agnostic way (deb/rpm/apk);
# install sets up paths (e.g. /usr/bin/alkemist/lfr/scripts) via GITHUB_PATH.
#
name: "Runsafe .NET Setup SBOM Action"
description: "Setup Runsafe Platform for .NET"
inputs:
  license_key:
    description: "Runsafe license key"
    required: true
    type: string
runs:
  using: "composite"

  steps:
    - name: List Github Env Vars
      shell: bash
      run: |
        echo "GITHUB_REPOSITORY_ID: $GITHUB_REPOSITORY_ID"
        echo "GITHUB_SHA: $GITHUB_SHA"
        echo "GITHUB_SERVER_URL: $GITHUB_SERVER_URL"
        echo "GITHUB_RUN_ID: $GITHUB_RUN_ID"
        echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
        echo "GITHUB_RUN_ATTEMPT: $GITHUB_RUN_ATTEMPT"
    - name: Runsafe Platform Setup
      if: runner.os == 'Linux'
      shell: bash
      env:
        RUNSAFE_SBOM_GENERATOR_VERSION: 2.9.2
        RUNSAFE_SYFT_VERSION: 1.42.4
      run: |
        RUNSAFE_SERVER=https://app.runsafesecurity.com
        if [ -z "${RUNSAFE_SBOM_SERVER}" ]; then export RUNSAFE_SBOM_SERVER=${RUNSAFE_SERVER}; fi
        if [ -z "${RUNSAFE_LICENSE_SERVER}" ]; then export RUNSAFE_LICENSE_SERVER=${RUNSAFE_SERVER}; fi
        echo "RUNSAFE_SBOM_GENERATOR_VERSION=${RUNSAFE_SBOM_GENERATOR_VERSION}" >> $GITHUB_ENV
        echo "RUNSAFE_SYFT_VERSION=${RUNSAFE_SYFT_VERSION}" >> $GITHUB_ENV
        echo "RUNSAFE_SBOM_SERVER=${RUNSAFE_SBOM_SERVER}" >> $GITHUB_ENV
        echo "RUNSAFE_LICENSE_SERVER=${RUNSAFE_LICENSE_SERVER}" >> $GITHUB_ENV

        RUNSAFE_LICENSE_KEY=${{ inputs.license_key }}
        export RUNSAFE_LICENSE_KEY=${RUNSAFE_LICENSE_KEY}
        echo "RUNSAFE_LICENSE_KEY=${RUNSAFE_LICENSE_KEY}" >> $GITHUB_ENV

        RUNSAFE_FEATURES_ENABLED=$(curl -L -H "x-runsafe-license-key: ${RUNSAFE_LICENSE_KEY}" ${RUNSAFE_SBOM_SERVER}/api/external-repos/github/${GITHUB_REPOSITORY_ID}/enabled-features)
        CURL_EXIT_CODE=$?
        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "Error: Failed to fetch enabled features from Runsafe Platform (exit code $CURL_EXIT_CODE)"
          exit 1
        fi
        export RUNSAFE_FEATURES_ENABLED
        echo $RUNSAFE_FEATURES_ENABLED

        cd ${GITHUB_WORKSPACE}

        if [[ $RUNSAFE_FEATURES_ENABLED == *"identify"* ]]; then
          echo "Identify!";
          mkdir -p RUNSAFE_SBOM_PACKAGES
          curl -L -s https://packages.runsafesecurity.com/public/runsafe/raw/versions/${RUNSAFE_SBOM_GENERATOR_VERSION}/download_runsafe_sbom_packages.sh -o download_runsafe_sbom_packages.sh
          chmod +x download_runsafe_sbom_packages.sh
          cd RUNSAFE_SBOM_PACKAGES
          ../download_runsafe_sbom_packages.sh
          mkdir -p bin
          curl -L -o bin/runsafe_sbom https://packages.runsafesecurity.com/public/runsafe/raw/versions/${RUNSAFE_SBOM_GENERATOR_VERSION}/runsafe_sbom
          chmod +x bin/runsafe_sbom
          chmod +x scripts/*.sh 2>/dev/null || true
          cd ..
          ${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin/runsafe_sbom platform start-scan
          export RUNSAFE_IDENTIFY_ENABLED=1
          echo "RUNSAFE_IDENTIFY_ENABLED=${RUNSAFE_IDENTIFY_ENABLED}" >> $GITHUB_ENV

          RUNSAFE_ORG_ID=$(curl --fail -s -L -H "x-runsafe-license-key: ${RUNSAFE_LICENSE_KEY}" "${RUNSAFE_SBOM_SERVER}/api/organizations/current-organization-id" || true)
          if [ -z "${RUNSAFE_ORG_ID}" ]; then
            echo "[RunSafe Security] Error: Could not obtain RUNSAFE_ORG_ID (empty response). Please contact support@runsafesecurity.com."
          fi
          echo "[RunSafe Security] RUNSAFE_ORG_ID=$RUNSAFE_ORG_ID"
          echo "RUNSAFE_ORG_ID=${RUNSAFE_ORG_ID}" >> $GITHUB_ENV

          RUNSAFE_DOTNET_AUDIT_ID=$(curl --fail -s -L -X POST \
              -H "x-runsafe-license-key: ${RUNSAFE_LICENSE_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"source\":\"GitHub\",\"language\":\"dotnet\",\"serverUrl\":\"${GITHUB_SERVER_URL}\",\"pipelineId\":\"${GITHUB_RUN_ID}\",\"fullRepo\":\"${GITHUB_REPOSITORY_ID}\",\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF_NAME}\"}" \
              "${RUNSAFE_SBOM_SERVER}/api/organizations/${RUNSAFE_ORG_ID}/audits" || true)
          if [ -z "${RUNSAFE_DOTNET_AUDIT_ID}" ]; then
            echo "[RunSafe Security] Error: Could not obtain RUNSAFE_DOTNET_AUDIT_ID (empty response). Please contact support@runsafesecurity.com."
          fi
          echo "[RunSafe Security] RUNSAFE_DOTNET_AUDIT_ID=$RUNSAFE_DOTNET_AUDIT_ID"
          echo "RUNSAFE_DOTNET_AUDIT_ID=${RUNSAFE_DOTNET_AUDIT_ID}" >> $GITHUB_ENV
        fi
    - name: Runsafe .NET Platform Setup - Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        curl -L -f -o syft_${RUNSAFE_SYFT_VERSION}_linux_amd64.tar.gz https://github.com/anchore/syft/releases/download/v${RUNSAFE_SYFT_VERSION}/syft_${RUNSAFE_SYFT_VERSION}_linux_amd64.tar.gz && \
        mkdir -p ${GITHUB_WORKSPACE}/syft_${RUNSAFE_SYFT_VERSION}_linux_amd64 && \
        tar -xzf syft_${RUNSAFE_SYFT_VERSION}_linux_amd64.tar.gz -C ${GITHUB_WORKSPACE}/syft_${RUNSAFE_SYFT_VERSION}_linux_amd64 && \
        mkdir -p ${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin && \
        mv ${GITHUB_WORKSPACE}/syft_${RUNSAFE_SYFT_VERSION}_linux_amd64/syft ${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin/ && \
        chmod +x ${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin/syft && \
        # Only delete the tarball but keep the extracted directory to keep the license file
        rm ${GITHUB_WORKSPACE}/syft_${RUNSAFE_SYFT_VERSION}_linux_amd64.tar.gz

        echo "GITHUB_REPOSITORY_ID=${{ github.repository_id }}" >> "$GITHUB_ENV"
        CAPTURE_FILE="${GITHUB_WORKSPACE}/.dotnet_projects_captured/${GITHUB_RUN_ID}_scan_roots.txt"
        RUNSAFE_DOTNET_PROJECTS_CAPTURE_FILE=${CAPTURE_FILE}
        echo "RUNSAFE_DOTNET_PROJECTS_CAPTURE_FILE=${CAPTURE_FILE}" >> "$GITHUB_ENV"
        echo "RUNSAFE_DOTNET_PROJECTS_CAPTURE_FILE=${RUNSAFE_DOTNET_PROJECTS_CAPTURE_FILE}" >> "$GITHUB_ENV"
        echo "RUNSAFE_REAL_DOTNET_PATH=$(command -v dotnet)" >> "$GITHUB_ENV"
        echo "${GITHUB_WORKSPACE}/.runsafe_dotnet_interceptor" >> "$GITHUB_PATH"

        mkdir -p "${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin"
        cp ${{ github.action_path }}/bin/* "${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin/"
        . "${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin/dotnet-gremlin-setup.sh"
    - name: Runsafe Platform Setup
      if: runner.os == 'Windows'
      shell: bash
      env:
        RUNSAFE_SBOM_GENERATOR_VERSION: 2.9.2
        RUNSAFE_SYFT_VERSION: 1.42.4
      run: |
        RUNSAFE_SERVER=https://app.runsafesecurity.com
        if [ -z "${RUNSAFE_SBOM_SERVER}" ]; then export RUNSAFE_SBOM_SERVER=${RUNSAFE_SERVER}; fi
        if [ -z "${RUNSAFE_LICENSE_SERVER}" ]; then export RUNSAFE_LICENSE_SERVER=${RUNSAFE_SERVER}; fi
        echo "RUNSAFE_SBOM_GENERATOR_VERSION=${RUNSAFE_SBOM_GENERATOR_VERSION}" >> $GITHUB_ENV
        echo "RUNSAFE_SYFT_VERSION=${RUNSAFE_SYFT_VERSION}" >> $GITHUB_ENV
        echo "RUNSAFE_SBOM_SERVER=${RUNSAFE_SBOM_SERVER}" >> $GITHUB_ENV
        echo "RUNSAFE_LICENSE_SERVER=${RUNSAFE_LICENSE_SERVER}" >> $GITHUB_ENV

        RUNSAFE_LICENSE_KEY=${{ inputs.license_key }}
        export RUNSAFE_LICENSE_KEY=${RUNSAFE_LICENSE_KEY}
        echo "RUNSAFE_LICENSE_KEY=${RUNSAFE_LICENSE_KEY}" >> $GITHUB_ENV

        RUNSAFE_FEATURES_ENABLED=$(curl -L -H "x-runsafe-license-key: ${RUNSAFE_LICENSE_KEY}" ${RUNSAFE_SBOM_SERVER}/api/external-repos/github/${GITHUB_REPOSITORY_ID}/enabled-features)
        CURL_EXIT_CODE=$?
        if [ $CURL_EXIT_CODE -ne 0 ]; then
          echo "Error: Failed to fetch enabled features from Runsafe Platform (exit code $CURL_EXIT_CODE)"
          exit 1
        fi
        export RUNSAFE_FEATURES_ENABLED
        echo $RUNSAFE_FEATURES_ENABLED

        cd ${GITHUB_WORKSPACE}

        if [[ $RUNSAFE_FEATURES_ENABLED == *"identify"* ]]; then
          echo "Identify!";
          mkdir -p RUNSAFE_SBOM_PACKAGES
          cd RUNSAFE_SBOM_PACKAGES
          curl -L -o runsafe_sbom_${RUNSAFE_SBOM_GENERATOR_VERSION}_signed.zip https://packages.runsafesecurity.com/public/runsafe/raw/versions/${RUNSAFE_SBOM_GENERATOR_VERSION}/runsafe_sbom_${RUNSAFE_SBOM_GENERATOR_VERSION}_signed.zip
          unzip runsafe_sbom_${RUNSAFE_SBOM_GENERATOR_VERSION}_signed.zip
          mv runsafe_sbom/* .
          chmod +x bin/runsafe_sbom.exe
          chmod +x bin/runsafe_sbom_service.exe
          ./bin/runsafe_sbom.exe install -y
          export PATH=${GITHUB_WORKSPACE}/RUNSAFE_SBOM_PACKAGES/bin:$PATH
          rm -f runsafe_sbom_${RUNSAFE_SBOM_GENERATOR_VERSION}_signed.zip
          cd ..
          runsafe_sbom.exe platform start-scan
          export RUNSAFE_SBOM_SERVER_NO_PREFIX=${RUNSAFE_SBOM_SERVER#*//}
          echo "RUNSAFE_SBOM_SERVER_NO_PREFIX=${RUNSAFE_SBOM_SERVER_NO_PREFIX}" >> $GITHUB_ENV
          export RUNSAFE_IDENTIFY_ENABLED=1
          echo "RUNSAFE_IDENTIFY_ENABLED=${RUNSAFE_IDENTIFY_ENABLED}" >> $GITHUB_ENV

          RUNSAFE_ORG_ID=$(curl --fail -s -L -H "x-runsafe-license-key: ${RUNSAFE_LICENSE_KEY}" "${RUNSAFE_SBOM_SERVER}/api/organizations/current-organization-id" || true)
          if [ -z "${RUNSAFE_ORG_ID}" ]; then
            echo "[RunSafe Security] Error: Could not obtain RUNSAFE_ORG_ID (empty response). Please contact support@runsafesecurity.com."
          fi
          echo "[RunSafe Security] RUNSAFE_ORG_ID=$RUNSAFE_ORG_ID"
          echo "RUNSAFE_ORG_ID=${RUNSAFE_ORG_ID}" >> $GITHUB_ENV

          RUNSAFE_DOTNET_AUDIT_ID=$(curl --fail -s -L -X POST \
              -H "x-runsafe-license-key: ${RUNSAFE_LICENSE_KEY}" \
              -H "Accept: application/json" \
              -H "Content-Type: application/json" \
              -d "{\"source\":\"GitHub\",\"language\":\"dotnet\",\"serverUrl\":\"${GITHUB_SERVER_URL}\",\"pipelineId\":\"${GITHUB_RUN_ID}\",\"fullRepo\":\"${GITHUB_REPOSITORY_ID}\",\"sha\":\"${GITHUB_SHA}\",\"ref\":\"${GITHUB_REF_NAME}\"}" \
              "${RUNSAFE_SBOM_SERVER}/api/organizations/${RUNSAFE_ORG_ID}/audits" || true)
          if [ -z "${RUNSAFE_DOTNET_AUDIT_ID}" ]; then
            echo "[RunSafe Security] Error: Could not obtain RUNSAFE_DOTNET_AUDIT_ID (empty response). Please contact support@runsafesecurity.com."
          fi
          echo "[RunSafe Security] RUNSAFE_DOTNET_AUDIT_ID=$RUNSAFE_DOTNET_AUDIT_ID"
          echo "RUNSAFE_DOTNET_AUDIT_ID=${RUNSAFE_DOTNET_AUDIT_ID}" >> $GITHUB_ENV
        fi
    - name: Runsafe .NET Platform Setup - Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $packagesBin = Join-Path $env:GITHUB_WORKSPACE 'RUNSAFE_SBOM_PACKAGES\bin'
        New-Item -ItemType Directory -Force -Path $packagesBin | Out-Null
        $syftUrl = "https://github.com/anchore/syft/releases/download/v$($env:RUNSAFE_SYFT_VERSION)/syft_$($env:RUNSAFE_SYFT_VERSION)_windows_amd64.zip"
        $syftZip = Join-Path $env:GITHUB_WORKSPACE "syft_$($env:RUNSAFE_SYFT_VERSION)_windows_amd64.zip"
        try {
          Invoke-WebRequest -Uri $syftUrl -OutFile $syftZip -ErrorAction Stop
        } catch {
          Write-Error "Failed to download syft: $_"
          exit 1
        }
        Expand-Archive -LiteralPath $syftZip -DestinationPath $packagesBin -Force
        Remove-Item -LiteralPath $syftZip -Force

        Add-Content -LiteralPath $env:GITHUB_ENV -Value "GITHUB_REPOSITORY_ID=${{ github.repository_id }}"

        $captureFile = Join-Path $env:GITHUB_WORKSPACE ".dotnet_projects_captured\$($env:GITHUB_RUN_ID)_scan_roots.txt"
        $env:RUNSAFE_DOTNET_PROJECTS_CAPTURE_FILE = $captureFile
        Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUNSAFE_DOTNET_PROJECTS_CAPTURE_FILE=$captureFile"

        $realDotnet = (Get-Command dotnet -CommandType Application -ErrorAction SilentlyContinue | Select-Object -First 1).Path
        if ($realDotnet) {
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "RUNSAFE_REAL_DOTNET_PATH=$realDotnet"
        }
        Add-Content -LiteralPath $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE '.runsafe_dotnet_interceptor')

        Copy-Item -Force -Path "${{ github.action_path }}\bin\*" -Destination $packagesBin
        & "$env:GITHUB_WORKSPACE\RUNSAFE_SBOM_PACKAGES\bin\dotnet-gremlin-setup.ps1"
